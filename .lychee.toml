# Only check absolute external URLs — skip root-relative paths like
# /images/hero.png and /essentials/code which are resolved by the
# Mintlify platform at render time, not checkable from local files
scheme = ["https", "http"]

exclude = [
  # npmjs.com blocks automated checkers with 403
  "npmjs\\.com",

  # Mintlify's own docs URLs — boilerplate placeholder links that will be
  # replaced with LambShock content; Mintlify also reorganizes these frequently
  "mintlify\\.com\\/docs",
]

exclude_path = ["node_modules", ".git", "package-lock.json"]
