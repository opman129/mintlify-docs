# Resolve root-relative paths (e.g. /images/hero.png) into an excludable
# placeholder domain instead of crashing at URL construction time
base = "https://placeholder.invalid"

exclude = [
  # Root-relative paths resolved via base above — not real external URLs
  "placeholder\\.invalid",

  # npmjs.com blocks automated checkers with 403
  "npmjs\\.com",

  # Mintlify's own docs URLs — boilerplate placeholder links that will be
  # replaced with LambShock content; Mintlify also reorganizes these frequently
  "mintlify\\.com\\/docs",
]

exclude_path = ["node_modules", ".git", "package-lock.json"]
